name: Atualizar catálogo da Central

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tools/gerar_manifesto.py'
      - '.github/workflows/atualizar-catalogo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Recriar manifest.json
        run: python3 tools/gerar_manifesto.py
      - name: Publicar catálogo, se mudou
        run: |
          if git diff --quiet -- manifest.json; then
            echo 'Catálogo já está atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m 'Atualizar catálogo de scripts [automático]'
          git push
